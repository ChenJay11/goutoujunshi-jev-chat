name: iOS unsigned IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: integrations/jev_ios
    steps:
      - uses: actions/checkout@v4
      - name: Offline checks
        run: bash tools/check.sh
      - name: Build device app without signing
        run: |
          xcodebuild -project GoutouJunshi.xcodeproj \
            -scheme GoutouJunshi \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build-device \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
      - name: Package unsigned IPA
        run: |
          APP_PATH=$(find build-device/Build/Products -maxdepth 3 -type d -name "GoutouJunshi.app" | head -1)
          echo "found app: $APP_PATH"
          test -n "$APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry goutoujunshi-unsigned.ipa Payload
          ls -lh goutoujunshi-unsigned.ipa
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: goutoujunshi-unsigned-ipa
          path: integrations/jev_ios/goutoujunshi-unsigned.ipa
          if-no-files-found: error
